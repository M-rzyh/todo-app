<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-Do</title>
  <meta name="description" content="My to-do list, synced with Google Calendar">
  <meta name="theme-color" content="#dc4c3e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Setup / sign-in screens (rendered by app.js) -->
  <div id="screen" class="screen" hidden></div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>To-Do</span>
      </div>
      <button class="add-btn" data-action="new"><span class="plus">+</span> Add task</button>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
      </label>
      <nav class="nav" id="nav-main"></nav>
      <div class="nav-heading">Priorities</div>
      <nav class="nav" id="nav-priorities"></nav>
      <div class="nav-heading">Labels</div>
      <nav class="nav" id="nav-labels"></nav>
      <div class="sidebar-foot">
        <label class="switch"><input type="checkbox" id="show-completed"><span></span> Show completed</label>
        <button class="link" data-action="settings">Settings</button>
      </div>
    </aside>
    <div class="backdrop" data-action="close-sidebar"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggle-sidebar" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div id="banner" class="banner" hidden></div>
        <div class="spacer"></div>
        <span id="sync-status" class="sync-status"></span>
        <button class="icon-btn" data-action="refresh" aria-label="Refresh" title="Sync now (r)">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4z"/></svg>
        </button>
      </header>
      <section id="content" class="content"></section>
    </main>

    <button class="fab" data-action="new" aria-label="Add task">+</button>
  </div>

  <!-- Task editor -->
  <dialog id="editor" class="editor">
    <form method="dialog" id="editor-form" autocomplete="off">
      <input id="f-name" class="f-name" placeholder="Task name — try “Submit report tomorrow 5pm p1 #lab”" required>
      <div id="f-chips" class="chips"></div>
      <textarea id="f-desc" class="f-desc" rows="3" placeholder="Description"></textarea>

      <div class="fields">
        <label class="field"><span>Deadline</span>
          <input type="date" id="f-date">
        </label>
        <label class="field"><span>Time <small>(optional)</small></span>
          <span class="with-clear"><input type="time" id="f-time"><button type="button" class="clear" data-clear="f-time" aria-label="Clear time">×</button></span>
        </label>
        <label class="field"><span>Repeat</span>
          <select id="f-repeat">
            <option value="">Doesn't repeat</option>
            <option value="DAILY">Every day</option>
            <option value="WEEKDAYS">Every weekday (Mon–Fri)</option>
            <option value="WEEKLY">Every week</option>
            <option value="MONTHLY">Every month</option>
            <option value="YEARLY">Every year</option>
            <option value="CUSTOM">Custom…</option>
          </select>
        </label>
      </div>

      <div id="repeat-extra" class="repeat-extra" hidden>
        <div id="custom-row" class="row">
          Every <input type="number" id="f-interval" min="1" max="99" value="1">
          <select id="f-unit"><option value="DAILY">days</option><option value="WEEKLY">weeks</option><option value="MONTHLY">months</option><option value="YEARLY">years</option></select>
        </div>
        <div id="days-row" class="row days"></div>
        <div class="row">Until <span class="with-clear"><input type="date" id="f-until"><button type="button" class="clear" data-clear="f-until" aria-label="Clear end date">×</button></span> <small>(optional)</small></div>
      </div>

      <div class="fields">
        <div class="field"><span>Priority</span>
          <div class="prio-picker" id="f-priority"></div>
        </div>
        <div class="field grow"><span>Labels</span>
          <div class="label-input" id="label-box">
            <span id="f-labels"></span>
            <input id="f-label-text" list="label-list" placeholder="Add label…">
            <datalist id="label-list"></datalist>
          </div>
        </div>
      </div>

      <div id="scope" class="scope" hidden>
        <span>Apply changes to:</span>
        <label><input type="radio" name="scope" value="this" checked> This occurrence</label>
        <label><input type="radio" name="scope" value="all"> All occurrences</label>
      </div>

      <div class="editor-foot">
        <button type="button" class="btn danger ghost" id="f-delete" hidden>Delete</button>
        <a id="f-gcal" class="link small" target="_blank" rel="noopener" hidden>Open in Google Calendar</a>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" value="cancel" id="f-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="f-save">Add task</button>
      </div>
    </form>
  </dialog>

  <!-- Generic choice dialog -->
  <dialog id="chooser" class="chooser">
    <form method="dialog">
      <p id="chooser-text"></p>
      <div id="chooser-buttons" class="chooser-buttons"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
